<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolBox</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <h1 class="logo">ToolBox</h1>
    <nav class="categories">
      <button class="cat-btn active" data-cat="">All <span class="count" id="count-all">0</span></button>
      <button class="cat-btn" data-cat="archived">Archived <span class="count" id="count-archived">0</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <input type="text" id="search" placeholder="Search services..." />
      <button id="add-btn" class="primary">+ Add</button>
    </header>

    <div id="grid" class="grid"></div>

    <div id="empty" class="empty" style="display:none">
      <h2>No services yet</h2>
      <p>Click "+ Add" to save your first tool.</p>
    </div>
  </main>

  <div id="modal" class="modal" style="display:none">
    <div class="modal-content">
      <h2 id="modal-title">Add Service</h2>
      <label>URL<input type="url" id="input-url" placeholder="https://example.com" /></label>
      <label>Name<input type="text" id="input-name" placeholder="Auto-detected" /></label>
      <label>Category
        <select id="input-category"></select>
      </label>
      <label>Notes<input type="text" id="input-notes" placeholder="Optional" /></label>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

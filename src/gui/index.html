<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forget-Me-Knot ToolBox</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <input type="text" id="search" placeholder="Search..." />
      <button id="sort-btn" class="sort-btn" title="Sort A-Z or Z-A">A–Z ↑</button>
      <button id="add-btn" class="primary">+ Add</button>
    </header>

    <aside class="sidebar">
      <div class="logo-container">
        <div class="app-logo-wrapper">
          <img src="logo.png" alt="ToolBox Logo" class="app-logo" />
        </div>
      </div>
      <button class="cat-btn active" data-cat="">All <span class="count" id="count-all">0</span></button>
      <div id="category-list"></div>
      <button class="cat-btn" data-cat="archived">Archived <span class="count" id="count-archived">0</span></button>
      <div class="sidebar-footer">
        <button id="manage-categories-btn" class="manage-cat-btn" title="Add or remove categories">⊕ Categories</button>
        <div class="version-label">Forget-Me-Knot ToolBox v0.1.14</div>
      </div>
    </aside>

    <main>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" style="display:none">
        <h2>No services yet</h2>
        <p>Click "+ Add" to save your first tool.</p>
      </div>
    </main>
  </div>

  <!-- Service add/edit modal -->
  <div id="modal" class="modal" style="display:none">
    <form id="service-form" class="modal-content">
      <h2 id="modal-title">Add Service</h2>
      <label>URL<input type="url" id="input-url" placeholder="https://example.com" required /></label>
      <label>Name<input type="text" id="input-name" placeholder="Auto-detected" /></label>
      <label>Category
        <select id="input-category"></select>
      </label>
      <label id="label-status">Status
        <select id="input-status">
          <option value="active">Active</option>
          <option value="archived">Archived</option>
        </select>
      </label>
      <label>Notes<textarea id="input-notes" placeholder="Optional"></textarea></label>
      <div class="modal-actions">
        <button type="button" id="modal-delete" class="danger" style="display:none; margin-right: auto;">Delete</button>
        <button type="button" id="modal-archive" style="display:none">Archive</button>
        <button type="button" id="modal-cancel">Cancel</button>
        <button type="submit" id="modal-save" class="primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Categories management modal -->
  <div id="categories-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h2>Manage Categories</h2>
      <div id="categories-list" class="categories-list"></div>
      <form id="new-category-form" class="new-category-form">
        <input type="text" id="new-category-label" placeholder="New category name…" maxlength="32" autocomplete="off" />
        <button type="submit" class="primary" id="new-category-add">Add</button>
      </form>
      <div class="modal-actions" style="margin-top:4px;">
        <button type="button" id="categories-modal-close">Done</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
